[project]
name = "indexcalc"
version = "0.1.0"
description = "Symbolic tensor index calculus with JAX backend"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jaxlib",
]

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
dev = ["pytest", "ipython", "sympy>=1.12"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
